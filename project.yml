name: DingDing
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DingDing:
    type: application
    platform: iOS
    sources:
      - DingDing
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_PREFIX).dingding
        PRODUCT_NAME: DingDing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: DingDing/Resources/Info.plist
    dependencies:
      - target: DingDingWidgets
        embed: true
  DingDingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - DingDingWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_PREFIX).dingding.widgets
        PRODUCT_NAME: DingDingWidgets
        INFOPLIST_FILE: DingDingWidgets/Info.plist
        SKIP_INSTALL: YES
  DingDingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DingDingTests
        excludes:
          - Fixtures
      - path: DingDingTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DingDing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_PREFIX).dingding.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DingDing.app/DingDing"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DingDing:
    build:
      targets:
        DingDing: all
        DingDingTests: [test]
    test:
      targets:
        - DingDingTests
